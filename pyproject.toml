[project]
name = "woodenox"
version = "0.1.0"
description = "Run ACP agents from Dida365 tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol>=0.12.1",
    "httpx2[socks]>=2.13",
    "mcp>=2.2.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
woodenox = "woodenox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
